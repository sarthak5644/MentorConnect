version: "3.9"

# ==========================================================
# MentorConnect Backend - docker-compose
# Brings up: MySQL database + the FastAPI application.
# Usage:
#   1. cp .env.example .env   (then edit values, especially secrets/passwords)
#   2. docker-compose up --build
#   3. API available at http://localhost:8000/docs
# ==========================================================

services:
  db:
    image: mysql:8.0
    container_name: mentorconnect_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mentorconnect_db}
      MYSQL_USER: ${DB_USER:-mentorconnect_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_this_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_this_root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-change_this_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mentorconnect_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

volumes:
  mysql_data:
